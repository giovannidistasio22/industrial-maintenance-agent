# FASE 11 - Stack completo in Docker
#
#   docker compose up --build
#
# Servizi:
#   cmms-db   PostgreSQL (dati CMMS, volume persistente)
#   cmms      API REST CMMS (main6.py) + seed automatico all'avvio
#   chroma    Vector DB (server Chroma, volume persistente)
#   ingest    one-shot: costruisce l'indice Chroma da docs/*.pdf
#   agent     Agente + API (main9.py, Fase 10)
#
# Porte sull'host: mappature overridabili via .env (le porte INTERNE dei
# container non cambiano, quindi l'incrocio interno non va toccato):
#   POSTGRES_PORT=5433 CMMS_PORT=8011 CHROMA_HOST_PORT=8006 AGENT_PORT=8005
# Utile se le porte standard sono occupate (es. port forward di VS Code).

# Ollama resta sull'host (default: http://host.docker.internal:11434).
# Per girarlo ANCHE in Docker:
#   docker compose --profile ollama up
#   docker compose exec ollama ollama pull llama3.1
#   docker compose exec ollama ollama pull nomic-embed-text
#   e imposta OLLAMA_BASE_URL=http://ollama:11434 (in un file .env o nell'ambiente)

services:
  cmms-db:
    image: postgres:16
    container_name: cmms-db
    environment:
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: cmms
      POSTGRES_DB: cmms
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cmms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmms -d cmms"]
      interval: 5s
      timeout: 3s
      retries: 10

  cmms:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python seed.py && uvicorn main6:app --host 0.0.0.0 --port 8010"
    environment:
      DATABASE_URL: postgresql+psycopg://cmms:cmms@cmms-db:5432/cmms
      CMMS_API_KEY: ${CMMS_API_KEY:-dev-cmms-key}
    ports:
      - "${CMMS_PORT:-8010}:8010"
    depends_on:
      cmms-db:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "${CHROMA_HOST_PORT:-8004}:8000"  # 8004 sull'host per non scontrare le fasi precedenti (8000)
    volumes:
      - chroma_data:/data  # il server persiste in /data (vedi /config.yaml dell'immagine)
    healthcheck:
      # l'immagine e' minimale (nessun python/curl): check TCP della porta API
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: costruisce l'indice dei manuali nel server Chroma.
  # Si ri-esegue a ogni 'docker compose up' (idempotente: ricrea la
  # collection da zero). L'agente parte solo dopo che ha completato.
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    command: python ingest.py
    environment:
      DOCS_DIR: /app/docs
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      chroma:
        condition: service_healthy
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main9:app --host 0.0.0.0 --port 8003
    environment:
      CMMS_BASE_URL: http://cmms:8010
      CMMS_API_KEY: ${CMMS_API_KEY:-dev-cmms-key}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OBSERVABILITY_LOG_DIR: /data/logs
    ports:
      - "${AGENT_PORT:-8003}:8003"
    volumes:
      - agent_logs:/data/logs  # log JSONL + export trace della Fase 10
    depends_on:
      cmms:
        condition: service_started
      ingest:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Opzionale: Ollama in Docker (default: Ollama resta sull'host).
  # Attivazione: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  cmms_pgdata:
  chroma_data:
  agent_logs:
  ollama_data:
