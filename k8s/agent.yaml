# Agente (backend/main.py) + HPA
#
# Mappatura da docker-compose:
#   service agent (uvicorn backend.main su 8003)
#     -> Deployment + Service (NodePort) + HorizontalPodAutoscaler
#
# L'agente e' STATELESS (la conversazione vive nel client, la memoria
# nel DB): e' il candidato naturale allo scaling orizzontale.
# Nota: in compose i log andavano su un volume (agent_logs); qui li
# lasciamo nel filesystem effimero del pod (si perdono col pod): per
# l'esercizio va bene, in produzione si shippano a un collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: im-agent
  labels:
    app: agent
spec:
  replicas: 2   # HPA partira' da qui (min 2, max 5, vedi hpa-agent.yaml)
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
      # Annotazioni Prometheus: se un'instance di Prometheus gira nel
      # cluster (o lo scrape dal fuori), l'endpoint /metrics dell'agente
      # viene raccolto automaticamente (vedi docs/deployment.md, "Monitoring").
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: agent
          image: industrial-maintenance-agent:ci
          command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8003"]
          ports:
            - containerPort: 8003
          env:
            - name: CMMS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: im-agent-config
                  key: CMMS_BASE_URL
            - name: CHROMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: im-agent-config
                  key: CHROMA_HOST
            - name: CHROMA_PORT
              valueFrom:
                configMapKeyRef:
                  name: im-agent-config
                  key: CHROMA_PORT
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: im-agent-config
                  key: OLLAMA_BASE_URL
            - name: OBSERVABILITY_LOG_DIR
              valueFrom:
                configMapKeyRef:
                  name: im-agent-config
                  key: OBSERVABILITY_LOG_DIR
            - name: CMMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: im-agent-secrets
                  key: CMMS_API_KEY
          # /health dell'agente verifica ANCHE il CMMS: readiness =
          # "io e il mio dipendente sono vivi".
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: im-agent
spec:
  type: NodePort
  selector:
    app: agent
  ports:
    - port: 8003
      targetPort: 8003
      nodePort: 30083
