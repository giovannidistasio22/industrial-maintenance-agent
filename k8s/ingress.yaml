# Ingress: il "portale" HTTP del cluster.
#
# NodePort espone su una porta per nodo; l'Ingress e' il modo "vero"
# di esporre HTTP: un unico punto d'ingresso che instrada per HOST
# (o per path) sui Service.
#
# Da kind v0.33 non c'e' piu' l'addon ingress-nginx: l'Ingress e'
# gestito NATIVAMENTE da cloud-provider-kind (il binario che
# 01-create-cluster.sh avvia sull'host). Quindi:
#   - niente ingressClassName (non c'e' nginx)
#   - l'Ingress riceve un IP esterno (rete kind), visibile con:
#       kubectl -n im-agent get ingress
#     e si raggiunge dall'host con l'header Host:
#       curl -H "Host: cmms.im.local" http://<IP>/health
#     (oppure /etc/hosts:  <IP>  cmms.im.local agent.im.local)
#
# E' l'equivalente k8s di "un reverse proxy davanti ai servizi".
# Su EKS al posto di cloud-provider-kind si usa l'ALB Ingress Controller.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cmms
  namespace: im-agent
spec:
  rules:
    - host: cmms.im.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cmms
                port:
                  number: 8010
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent
  namespace: im-agent
spec:
  rules:
    - host: agent.im.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent
                port:
                  number: 8003
