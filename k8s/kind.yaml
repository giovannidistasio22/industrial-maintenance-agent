# Config del cluster kind
#
# kind crea un cluster Kubernetes "vero" dentro un container Docker
# (il nodo e' un container: niente VM, niente overhead).
#
# extraPortMappings: fa uscire i NodePort del cluster sulla porta
# dell'host, cosi' puoi testare i servizi da localhost SENZA Ingress
# (vedi k8s/scripts/03-test.sh).
#
# Le porte host sono 18010/18003 (NON 8010/8003): quelle standard
# sono occupate dallo stack docker-compose, che gira sullo stesso
# server. Se il compose non e' attivo puoi rimettere 8010/8003.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4   # kind >= 0.33: la config API e' v1alpha4 (v1alpha1 rimosso)
nodes:
  - role: control-plane
    extraPortMappings:
      # NodePort 30010 (cmms) -> 18010 sull'host
      - containerPort: 30010
        hostPort: 18010
        protocol: TCP
      # NodePort 30083 (agent) -> 18003 sull'host
      - containerPort: 30083
        hostPort: 18003
        protocol: TCP
