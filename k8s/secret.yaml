# Secret: dati sensibili (password DB, API key).
#
# stringData per leggibilita' (k8s lo converte in base64).
# In produzione NON starebbe in chiaro nel repo: SealedSecrets,
# ExternalSecrets (AWS Secrets Manager su EKS) o vault. Qui e' un
# esercizio locale: credenziali di sviluppo, cluster throwaway.
apiVersion: v1
kind: Secret
metadata:
  name: im-agent-secrets
  namespace: im-agent
type: Opaque
stringData:
  POSTGRES_USER: "cmms"
  POSTGRES_PASSWORD: "cmms"
  POSTGRES_DB: "cmms"
  CMMS_API_KEY: "dev-cmms-key"
  # La URL del DB contiene le credenziali -> vive nel Secret,
  # non nel ConfigMap.
  DATABASE_URL: "postgresql+psycopg://cmms:cmms@cmms-db:5432/cmms"
